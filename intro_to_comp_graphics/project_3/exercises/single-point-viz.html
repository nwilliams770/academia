<!DOCTYPE html>
<html>
<head>
	<title>Single Point Bézier Visualizer</title>
	<script src="curves-math.js"></script>
	<style>
		body {
			font-family: Arial, sans-serif;
			display: flex;
			gap: 40px;
			padding: 20px;
			background: #f5f5f5;
		}
		.container {
			display: flex;
			flex-direction: column;
			gap: 20px;
		}
		canvas {
			border: 2px solid #333;
			background: white;
		}
		.controls {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}
		.control-row {
			display: flex;
			align-items: center;
			gap: 10px;
		}
		input[type="range"] {
			width: 300px;
		}
		.info {
			font-family: monospace;
			background: white;
			padding: 15px;
			border: 1px solid #ccc;
			border-radius: 4px;
			min-width: 300px;
		}
		.info-row {
			margin: 5px 0;
		}
		.weight {
			display: inline-block;
			width: 60px;
			text-align: right;
		}
		h2 {
			margin-top: 0;
		}
	</style>
</head>
<body>

<div class="container">
	<h1>Single Point Bézier Visualizer</h1>
	<canvas id="canvas" width="600" height="400"></canvas>

	<div class="controls">
		<div class="control-row">
			<label for="tSlider">Parameter t:</label>
			<input type="range" id="tSlider" min="0" max="1" step="0.01" value="0.5">
			<span id="tValue">0.50</span>
		</div>

		<div class="control-row">
			<label>
				<input type="checkbox" id="showDecasteljau" checked>
				Show de Casteljau construction
			</label>
		</div>

		<div class="control-row">
			<label>
				<input type="checkbox" id="showDerivative" checked>
				Show derivative (tangent)
			</label>
		</div>
	</div>
</div>

<div class="container">
	<div class="info">
		<h2>Point on Curve</h2>
		<div class="info-row">
			<strong>t = <span id="infoT">0.50</span></strong>
		</div>
		<div class="info-row">
			Point: (<span id="infoX">0</span>, <span id="infoY">0</span>)
		</div>

		<h2>Basis Weights</h2>
		<div class="info-row">
			b₀(t) = <span class="weight" id="w0">0.000</span>
		</div>
		<div class="info-row">
			b₁(t) = <span class="weight" id="w1">0.000</span>
		</div>
		<div class="info-row">
			b₂(t) = <span class="weight" id="w2">0.000</span>
		</div>
		<div class="info-row">
			b₃(t) = <span class="weight" id="w3">0.000</span>
		</div>
		<div class="info-row" style="border-top: 1px solid #ccc; padding-top: 10px; margin-top: 10px;">
			Sum = <span id="weightSum">0.000</span>
		</div>

		<h2>Derivative (Tangent)</h2>
		<div class="info-row">
			f'(t) = (<span id="derivX">0</span>, <span id="derivY">0</span>)
		</div>
		<div class="info-row">
			|f'(t)| = <span id="derivMag">0</span>
		</div>
	</div>
</div>

<script src="single-point-viz.js"></script>

</body>
</html>
